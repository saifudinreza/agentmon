name: CI

on:
  push:
    branches: [main]
  pull_request:

# Build lama di PR dibatalkan bila ada push baru, karena menit macOS dan Windows
# ditagih lebih mahal daripada Linux. Build di main tidak dibatalkan supaya setiap
# hasilnya tercatat.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    # Daemon dan hook berjalan di laptop pengguna, jadi diuji di ketiga sistem operasi.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
