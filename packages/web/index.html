<!doctype html>
<html lang="id" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover: isi layar sampai ke tepi (termasuk area notch iPhone); jarak aman diatur di CSS. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>AgentMon</title>
    <meta name="description" content="Pantau dan setujui aksi coding agent dari HP Anda." />
    <meta name="theme-color" content="#0b0f14" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
    <!-- iOS tidak memakai ikon dari manifest; ia mencari apple-touch-icon. -->
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="AgentMon" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <script>
      // Dijalankan SEBELUM halaman digambar supaya tema yang tersimpan langsung terpasang dan layar
      // tidak berkedip terang lalu gelap. Logika yang sama ada di src/theme/theme.ts (diuji di sana).
      (function () {
        var mode = "system";
        try {
          var saved = localStorage.getItem("agentmon.theme");
          if (saved === "light" || saved === "dark" || saved === "system") mode = saved;
        } catch (e) {}
        var dark = mode === "dark" || (mode === "system" && window.matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute("content", dark ? "#0b0f14" : "#f6f7f9");
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
